name: Deploy Blood Donor System

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: package-lock.json

    # Root workspace lockfile installs both backend and frontend
    - name: Install Dependencies
      run: npm ci

    - name: Run Backend Unit Tests
      run: npm test -w backend

    - name: Run Backend E2E Tests
      run: npm run test:e2e -w backend
      env:
        E2E_MONGODB_URI: mongodb://localhost:27017/donorconnect-e2e

    - name: Typecheck Frontend
      run: cd frontend && npx tsc --noEmit

    - name: Build Backend
      run: |
        cd backend
        npm run build
    
    - name: Build Frontend
      run: |
        cd frontend
        npm run build

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Deploy to Production
      run: |
        echo "Deploy to your chosen platform"
        # Add your deployment commands here
        # e.g., deploy to Vercel, AWS, DigitalOcean, etc.